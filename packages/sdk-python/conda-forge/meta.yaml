{#
  Draft conda-forge feedstock recipe for limetry.
  After the first PyPI release, open a feedstock PR at
  https://github.com/conda-forge/staged-recipes with this recipe
  (or let the regenerator bot track PyPI).
#}
{% set name = "limetry" %}
{% set version = "1.2.102" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/limetry-{{ version }}.tar.gz
  # sha256: fill after first PyPI sdist upload

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.11
    - pip
    - hatchling >=1.25
  run:
    - python >=3.11
    - httpx >=0.27

test:
  imports:
    - limetry
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://limetry.org
  summary: Python SDK for Limetry agent action governance
  license: MIT
  license_file: LICENSE
  doc_url: https://limetry.org/docs/sdk/python
  dev_url: https://github.com/limetrydev/limetry

extra:
  recipe-maintainers:
    - limetrydev
