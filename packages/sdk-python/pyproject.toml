[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "limetry"
version = "1.2.99"
description = "Python SDK for Limetry agent action governance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Limetry", email = "hello@limetry.com" },
]
keywords = ["limetry", "agent", "governance", "policy", "evaluate"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://limetry.org"
Documentation = "https://limetry.org/docs/sdk"
Repository = "https://github.com/limetrydev/limetry"
Issues = "https://github.com/limetrydev/limetry/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/limetry"]

[tool.hatch.build.targets.wheel.sources]
"src/limetry" = "limetry"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["limetry"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
