config:
  limetry-serverless:cloudProvider: aws
  limetry-serverless:apiDomain: oss-api-prod.limetry.org
  limetry-serverless:apiDomainZone: limetry.org
  limetry-serverless:manageCloudflare: "true"
  limetry-serverless:location: us-west-2
  limetry-serverless:databaseProvider: neon
  limetry-serverless:neonProjectName: limetry-serverless-prod
  limetry-serverless:neonRegion: aws-us-east-1
  limetry-serverless:minInstances: "0"
  limetry-serverless:maxInstances: "1"
  # limetry-serverless:sqliteDatabasePath: /tmp/limetry.sqlite
  # Neon is the default durable database. Set databaseProvider=sqlite only
  # for an intentional single-instance ephemeral deployment.

  cloudflare:apiToken:
