config:
  limetry-serverless:cloudProvider: aws
  limetry-serverless:apiDomain: api.limetry.dev
  limetry-serverless:apiDomainZone: limetry.dev
  limetry-serverless:manageDns: "true"
  limetry-serverless:dnsProvider: native
  limetry-serverless:location: us-west-2
  limetry-serverless:databaseProvider: neon
  limetry-serverless:neonProjectName: limetry-serverless-prod
  limetry-serverless:neonRegion: aws-us-east-1
  limetry-serverless:minInstances: "0"
  limetry-serverless:maxInstances: "1"
  # Compute: aws | gcp | azure — see README for auth and region keys.
  # DNS: dnsProvider native (Route 53 / Cloud DNS / Azure DNS) or cloudflare.
  # Database: neon (default), sqlite (single-instance), rds (AWS + VPC only).

