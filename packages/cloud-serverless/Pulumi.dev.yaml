config:
  limetry-serverless:cloudProvider: aws
  limetry-serverless:apiDomain: oss-api-dev.limetry.org
  limetry-serverless:apiDomainZone: limetry.org
  # limetry.org is not in Route 53 on this account; create ACM + API records at
  # your DNS provider from `pulumi stack output apiDnsRecords` (DNS-only, no proxy).
  limetry-serverless:manageDns: "false"
  # When limetry.org lives in Route 53: manageDns true and optionally:
  # limetry-serverless:apiHostedZoneId: Z1234567890ABC
  limetry-serverless:location: us-west-2
  # Keep the checked-in development stack credential-free. Neon remains the
  # code-level default; set databaseProvider=neon and provide neonApiKey or
  # databaseUrl for a durable shared database.
  limetry-serverless:databaseProvider: neon
  limetry-serverless:neonProjectName: limetry-serverless-dev
  limetry-serverless:neonRegion: aws-us-east-1
  limetry-serverless:minInstances: "0"
  limetry-serverless:maxInstances: "1"
  # limetry-serverless:sqliteDatabasePath: /tmp/limetry.sqlite
  # For GCP or Azure, change cloudProvider and location before previewing.
  # Azure managed PostgreSQL additionally requires:
  # limetry-serverless:allowPublicDatabase: "true"
  aws:region: us-west-2
  limetry-serverless:neonApiKey:
    secure: AAABAMWFZ4bU1k+fGU011uRzhCopVkQkkq4Xogbqg/eXLju06JaJ4ZsVk2Vnrq18S7dGgBLATNffyYH9UVOO6tB2iGdnmjVbvCbR/NlAHTtAk+W77dSXHrBEKwtqjGtvPd2ZL/4=
