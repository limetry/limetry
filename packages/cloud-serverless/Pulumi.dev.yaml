config:
  limetry-serverless:cloudProvider: aws
  limetry-serverless:location: us-west-2
  limetry-serverless:managedDatabase: "false"
  limetry-serverless:minInstances: "0"
  limetry-serverless:maxInstances: "1"
  limetry-serverless:sqliteDatabasePath: /tmp/limetry.sqlite
  # For GCP or Azure, change cloudProvider and location before previewing.
  # Azure managed PostgreSQL additionally requires:
  # limetry-serverless:allowPublicDatabase: "true"
  aws:region: us-west-2
