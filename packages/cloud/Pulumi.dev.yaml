config:
  limetry-core:cloudProvider: aws
  limetry-core:createCluster: "false"
  limetry-core:createRegistry: "false"
  limetry-core:location: us-west-2
  limetry-core:usePostgres: "false"
  limetry-core:apiDomain: dev.cloud.limetry.org
  # For an externally managed cluster, store its kubeconfig as a secret:
  # pulumi config set --secret limetry-core:kubeconfig "$(cat ~/.kube/config)"
  # To use GKE or AKS, change cloudProvider and location, then configure that
  # provider's credentials before running pulumi preview or pulumi up.
