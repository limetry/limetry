<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Limetry — Evaluate API (__APP_VERSION__)</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    body { margin: 0; background: #f8fafc; }
    .topbar { display: none; }
    .swagger-ui .info .title { font-family: "Geist", Inter, system-ui, sans-serif; }
    .limetry-version-bar {
      font-family: "Geist", Inter, system-ui, sans-serif;
      font-size: 0.8125rem;
      color: #475569;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 0.625rem 1.25rem;
    }
    .limetry-version-bar code {
      font-size: 0.8125rem;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="limetry-version-bar">Limetry Evaluate API <code>__APP_VERSION__</code></div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "/openapi.yaml",
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout",
    })
  </script>
</body>
</html>
