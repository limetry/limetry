name: Publish @limetry/ci to npm

on:
  push:
    tags:
      - "ci-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish @limetry/ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build dependencies
        run: yarn workspace @limetry/sdk build && yarn workspace @limetry/ci build

      - name: Test @limetry/ci
        run: yarn workspace @limetry/ci test

      - name: Stamp package version from root
        run: node scripts/stamp-publish-version.mjs packages/ci

      - name: Publish @limetry/ci
        run: yarn workspace @limetry/ci npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
