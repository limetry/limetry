name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Build packages needed for typecheck
        run: >-
          yarn build:sdk && yarn build:preflight &&
          yarn build:sql && yarn build:shopify && yarn build:ci
      - name: Typecheck TypeScript packages
        run: yarn typecheck
      - name: Generate and check API docs
        run: yarn docs:check
      - name: Build TypeScript packages
        run: >-
          yarn build:server && yarn build:cli &&
          yarn workspace @limetry/mcp build &&
          yarn build:ci && yarn build:sql && yarn build:shopify
      - name: Run TypeScript tests
        run: >-
          yarn test:preflight && yarn test:sdk && yarn test:server && yarn test:cli &&
          yarn workspace @limetry/ci test &&
          yarn workspace @limetry/sql test &&
          yarn workspace @limetry/shopify test
      - name: Run supported examples
        run: yarn test:examples
      - name: Smoke test CLI
        run: node packages/cli/dist/index.js --help

  coverage:
    runs-on: ubuntu-latest
    needs: node
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: limetry
          POSTGRES_PASSWORD: limetry
          POSTGRES_DB: limetry
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build:sdk && yarn build:server
      - name: Run critical-path coverage gates
        env:
          DATABASE_URL: postgresql://limetry:limetry@localhost:5432/limetry
          REDIS_URL: redis://localhost:6379
        run: yarn workspace @limetry/sdk test:critical-coverage && yarn workspace @limetry/server test:critical-coverage

  docker:
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v5
      - name: Build server image
        run: docker build -f packages/server/Dockerfile -t limetry-server:ci .
