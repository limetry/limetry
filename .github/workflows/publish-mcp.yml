name: Publish @limetry/mcp to npm

on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    name: Build and publish @limetry/mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Enable npm Trusted Publishing support
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build dependencies and @limetry/mcp
        run: yarn workspace @limetry/sdk build && yarn workspace @limetry/mcp build

      - name: Typecheck @limetry/mcp
        run: yarn tsgo -p packages/mcp/tsconfig.json --noEmit

      - name: Smoke test MCP
        run: node -e "require('node:fs').accessSync('packages/mcp/dist/index.js')"

      - name: Stamp package version from root
        run: node scripts/stamp-publish-version.mjs packages/mcp

      - name: Wait for published workspace dependencies
        run: node scripts/wait-for-npm-dependencies.mjs packages/mcp

      - name: Publish @limetry/mcp
        run: npm publish ./packages/mcp --access public
