name: Build and publish all @limetry packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test all packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all packages
        run: |
          yarn workspace @limetry/sdk build
          yarn workspace @limetry/preflight build
          yarn workspace @limetry/cli build
          yarn workspace @limetry/mcp build
          yarn workspace @limetry/ci build
          yarn workspace @limetry/shopify build
          yarn workspace @limetry/sql build
          yarn workspace @limetry/ui build

      - name: Test all packages
        run: |
          yarn workspace @limetry/sdk test
          yarn workspace @limetry/sdk test:critical-coverage
          yarn workspace @limetry/preflight test
          yarn workspace @limetry/cli test
          yarn tsgo -p packages/mcp/tsconfig.json --noEmit
          node -e "require('node:fs').accessSync('packages/mcp/dist/index.js')"
          yarn workspace @limetry/ci test
          yarn workspace @limetry/shopify test
          yarn workspace @limetry/sql test
          yarn workspace @limetry/ui test
          node packages/cli/dist/index.js --help

      - name: Upload package builds
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          if-no-files-found: error
          path: |
            packages/sdk/dist
            packages/preflight/dist
            packages/cli/dist
            packages/mcp/dist
            packages/ci/dist
            packages/shopify/dist
            packages/sql/dist
            packages/ui/dist

  publish:
    name: Publish @limetry/${{ matrix.package }}
    needs: verify
    if: github.event_name == 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: [sdk, ci, cli, mcp, preflight, shopify, sql, ui]
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable npm Trusted Publishing support
        run: npm install --global npm@11.21.0

      - name: Download package builds
        uses: actions/download-artifact@v4
        with:
          name: package-dist

      - name: Publish one package
        run: |
          package="${{ matrix.package }}"
          name="@limetry/$package"
          version="$(node -p "require('./packages/${package}/package.json').version")"
          restore_pack_manifest() {
            node scripts/rewrite-workspace-protocol.mjs restore "packages/$package" || true
          }
          trap restore_pack_manifest EXIT
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping it."
            exit 0
          fi
          dist_dir="packages/$package/dist"
          if [ ! -d "$dist_dir" ]; then
            echo "Missing $dist_dir — verify job must upload built artifacts before publish."
            exit 1
          fi
          node scripts/wait-for-npm-dependencies.mjs "packages/$package"
          npm publish "./packages/$package" --access public
