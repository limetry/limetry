name: Publish @limetry/shopify to npm

on:
  push:
    tags:
      - "shopify-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    name: Build and publish @limetry/shopify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Enable npm Trusted Publishing support
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build dependencies
        run: yarn workspace @limetry/sdk build && yarn workspace @limetry/shopify build

      - name: Test @limetry/shopify
        run: yarn workspace @limetry/shopify test

      - name: Stamp package version from root
        run: node scripts/stamp-publish-version.mjs packages/shopify

      - name: Wait for published workspace dependencies
        run: node scripts/wait-for-npm-dependencies.mjs packages/shopify

      - name: Publish @limetry/shopify
        run: npm publish ./packages/shopify --access public
