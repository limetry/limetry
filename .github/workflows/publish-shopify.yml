name: Publish @limetry/shopify to npm

on:
  push:
    tags:
      - "shopify-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish @limetry/shopify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build dependencies
        run: yarn workspace @limetry/sdk build && yarn workspace @limetry/shopify build

      - name: Test @limetry/shopify
        run: yarn workspace @limetry/shopify test

      - name: Stamp package version from root
        run: node scripts/stamp-publish-version.mjs packages/shopify

      - name: Publish @limetry/shopify
        run: yarn workspace @limetry/shopify npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
