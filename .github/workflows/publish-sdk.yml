name: Publish @limetry/sdk to npm

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish @limetry/sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build @limetry/sdk
        run: yarn workspace @limetry/sdk build

      - name: Test @limetry/sdk
        run: yarn workspace @limetry/sdk test && yarn workspace @limetry/sdk test:critical-coverage

      - name: Stamp package version from root
        run: node scripts/stamp-publish-version.mjs packages/sdk

      - name: Publish @limetry/sdk
        run: yarn workspace @limetry/sdk npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
