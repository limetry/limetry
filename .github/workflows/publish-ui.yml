name: Publish @limetry/ui to npm

on:
  push:
    tags:
      - "ui-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish @limetry/ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build @limetry/ui
        run: yarn workspace @limetry/ui build

      - name: Stamp package version from root
        run: node scripts/stamp-publish-version.mjs packages/ui

      - name: Publish @limetry/ui
        run: yarn workspace @limetry/ui npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
