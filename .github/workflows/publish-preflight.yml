name: Publish @limetry/preflight to npm

on:
  push:
    tags:
      - "preflight-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    name: Build and publish @limetry/preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Enable npm Trusted Publishing support
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build @limetry/preflight
        run: yarn workspace @limetry/preflight build

      - name: Test @limetry/preflight
        run: yarn workspace @limetry/preflight test

      - name: Stamp package version from root
        run: node scripts/stamp-publish-version.mjs packages/preflight

      - name: Publish @limetry/preflight
        run: npm publish ./packages/preflight --access public
