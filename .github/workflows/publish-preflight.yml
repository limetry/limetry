name: Publish @limetry/preflight to npm

on:
  push:
    tags:
      - "preflight-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish @limetry/preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build @limetry/preflight
        run: yarn workspace @limetry/preflight build

      - name: Test @limetry/preflight
        run: yarn workspace @limetry/preflight test

      - name: Stamp package version from root
        run: node scripts/stamp-publish-version.mjs packages/preflight

      - name: Publish @limetry/preflight
        run: yarn workspace @limetry/preflight npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
