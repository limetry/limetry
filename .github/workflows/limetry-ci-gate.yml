name: Limetry CI gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: Allow tests, deny deploy
    runs-on: ubuntu-latest
    env:
      LIMETRY_BEARER_TOKEN: ci-limetry-bearer-token-min-32-chars
      JWT_SECRET: ci-limetry-jwt-secret-min-32-characters
      DECISION_HMAC_SECRET: ci-limetry-decision-hmac-secret-32ch
      THROTTLE_MAX_REQUESTS_PER_MINUTE: "60"
      INPUT_LIMETRY_API_KEY: ci-limetry-bearer-token-min-32-chars
      INPUT_LIMETRY_BASE_URL: http://127.0.0.1:3810
      INPUT_AGENT_ID: github_actions
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build SDK, server, CLI, and CI gate
        run: yarn build:sdk && yarn build:preflight && yarn build:server && yarn build:cli && yarn build:ci

      - name: Start Limetry and apply ci-privilege policy
        id: boot
        uses: ./.github/actions/limetry-ci-server
        with:
          policy_file: packages/ci/policies/ci-privilege.json

      - name: Allow CI privilege (typecheck / tests may run)
        env:
          INPUT_POLICY_ID: ${{ steps.boot.outputs.policy_id }}
          INPUT_ACTION_TYPE: ci_privilege
          INPUT_REQUIRE_TRUSTED: "false"
        run: node packages/ci/dist/run-action.js

      - name: Deny production deploy (must stop this step)
        id: deny-deploy
        continue-on-error: true
        env:
          INPUT_POLICY_ID: ${{ steps.boot.outputs.policy_id }}
          INPUT_ACTION_TYPE: deploy
          INPUT_REQUIRE_TRUSTED: "false"
        run: node packages/ci/dist/run-action.js

      - name: Confirm Limetry stopped the deploy
        run: |
          set -euo pipefail
          if [ "${{ steps.deny-deploy.outcome }}" != "failure" ]; then
            echo "Expected action_type deploy to be denied by packages/ci/policies/ci-privilege.json"
            exit 1
          fi
          echo "Limetry denied deploy as designed (allow ci_privilege, deny deploy)"
